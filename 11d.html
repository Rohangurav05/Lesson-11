<!DOCTYPE html>
<html>

<head>
    <title>9f Problem</title>
    <style>
        .div {
            width: 200px;
            font-family: arial;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
            
            vertical-align: top;
            margin-right: 15px;
        }

        .image {
            width: 200px;
            height: 250px;
            display: block;
            object-fit: cover;
            margin-bottom: 0;
        }

        .name {
            font-family: Arial;
            font-size: 20px;
            margin-top: 3px;
            margin-bottom: 0;
            
            padding-left: 8px;
        }

        .friend {
            margin-top: 2px;
            color: grey;
            font-size: 15px;
            padding-left: 8px;
            margin-bottom: 0;
        }
        .add-friend
        {
            background-color: rgb(42, 124, 225);
            color: white;
            border: none;
            font-size: 15px;
            border-radius: 5px;
            padding-left: 12px;
            padding-right: 12px;
            padding-top: 5px;
            padding-bottom: 5px;
            margin-top: 8px;
            margin-left: 8px;
            margin-bottom:5px ;
        }
    </style>
</head>

<body>
    <div style="
        display: grid;
        grid-template-columns: 200px 200px 200px;
        column-gap: 20px;
        align-items: center;
        ">
        <div class="div">
            <img class="image" src="throne.jpg" alt="">
            <p class="name">Atharv</p>
            <p class="friend">2 mutual friends</p>
            <button class="add-friend">Add Friend</button>
        </div>
        <div class="div">
            <img class="image" src="hod.jpg" alt="">
            <p class="name">Akshay</p>
            <p class="friend">3 mutual friends</p>
            <button class="add-friend">Add Friend</button>
        </div>
        <div class="div">
            <img class="image" src="sword.jpg" alt="">
            <p class="name">Satya</p>
            <p class="friend">4 mutual friends</p>
            <button class="add-friend">Add Friend</button>
        </div>
    </div>
</body>

                                                   </html>
